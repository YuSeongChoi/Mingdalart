# SwiftLint configuration for Mingdalart
# Focused on maintainability and SwiftUI-friendly conventions.

included:
  - Mingdalart/Mingdalart
  - Mingdalart/MingdalartTests

excluded:
  - Mingdalart/Mingdalart/App/Resources/MingdalartResources.swift
  - Mingdalart/Mingdalart.xcodeproj
  - DerivedData
  - .build

# Keep default rules, then opt-in to additional ones below.
# Avoid over-strict rules that make SwiftUI awkward.

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 40
  error: 60

cyclomatic_complexity:
  warning: 12
  error: 20

# Prefer clarity over strictness for SwiftUI builder chains.
disabled_rules:
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - last_where
  - legacy_random
  - multiline_arguments
  - multiline_function_chains
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - implicit_optional_initialization
  - redundant_set_access_control
  - redundant_type_annotation
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Analyzer rules only apply when running `swiftlint analyze`.
analyzer_rules:
  - unused_declaration
  - unused_import
